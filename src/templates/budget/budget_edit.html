<section id="budget_edit">
  <h2 class="h1 fw-bold mb-4">Редактирование дохода/расхода</h2>
  <section class="d-flex py-3 gap-3 flex-wrap justify-content-center justify-content-xl-start">
    <div class="card border-0" style="width: 24.5rem;">
      <div class="card-body">
        <div class="mb-3">
          <input id="input_budget_create_type" type="text" class="form-control" placeholder="Тип" value="Доход">
        </div>
        <div class="mb-3">
          <input id="input_budget_create_category" type="text" class="form-control" placeholder="Категория" value="Зарплата">
        </div>
        <div class="mb-3">
          <input id="input_budget_create_sum" type="text" class="form-control" placeholder="Сумма в $" value="500$">
        </div>
        <div class="mb-3">
          <input id="input_budget_create_date" type="text" class="form-control" placeholder="Дата" value="11.09.2022">
        </div>
        <div class="mb-3">
          <input id="input_budget_create_comment" type="text" class="form-control" placeholder="Комментарий...">
        </div>
        <button type="button" class="btn btn-success me-1">Создать</button>
        <button type="button" class="btn btn-danger">Отмена</button>
      </div>
    </div>
  </section>
</section>
