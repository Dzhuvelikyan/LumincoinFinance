<section class="budget" id="budget">
    <h2 class="h1 fw-bold mb-5">Доходы и расходы</h2>
    <div class="card border-0 mb-4" style="width: 18.5rem;">
        <div class="card-body p-0 d-flex justify-content-between">
            <a href="/budget_create?type=income" role="button" class="btn btn-success">Создать доход</a>
            <a href="/budget_create?type=expense" role="button" class="btn btn-danger">Создать расход</a>
        </div>
    </div>
    <section class="nav-buttons d-flex flex-grow-0 gap-4 align-items-center mx-auto overflow-x-auto px-2 pb-3 px-md-1">
        <a href="/budget?filter=today" class="btn btn-outline-secondary fw-bold py-2" role="button">Сегодня</a>
        <a href="/budget?filter=week" class="btn btn-outline-secondary fw-bold py-2" role="button">Неделя</a>
        <a href="/budget?filter=month" class="btn btn-outline-secondary fw-bold py-2" role="button">Месяц</a>
        <a href="/budget?filter=year" class="btn btn-outline-secondary fw-bold py-2" role="button">Год</a>
        <a href="/budget?filter=all" class="btn btn-outline-secondary fw-bold py-2" role="button">Все</a>
        <a href="/budget?filter=interval" class="btn btn-outline-secondary fw-bold py-2" role="button">Интервал</a>
        <label class="label-interval position-relative fw-bold text-nowrap">с
            <input id="interval-date-from" type="date" class="date-link border-0 text-secondary ms-3 opacity-1">
<!--            <span class="position-absolute w-100 h-100 text-center">Дата</span>-->
        </label>
        <label class="label-interval position-relative fw-bold text-nowrap">по
            <input id="interval-date-to" type="date" class="date-link border-0 text-secondary ms-3 opacity-1">
<!--            <span class="position-absolute w-100 h-100 text-center">Дата</span>-->
        </label>
    </section>
    <section class="budget__table overflow-hidden overflow-x-auto">

                <th scope="col">Дата</th>
                <th scope="col">Комментарий</th>
                <th scope="col"></th>
            </tr>
            </thead>

    <!--Modal-->
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
         aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog vh-100 my-0 d-flex align-items-center">
            <div class="modal-content py-3">
                <div class="modal-body text-center fw-bold fs-5">
                    Вы действительно хотите удалить операцию?
                </div>
                <div class="modal-footer justify-content-center border-0">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Да, удалить</button>
